name: Web CI
on:
  pull_request:
  push:
    branches: [main, develop]
permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - run: pnpm exec eslint apps/web
      - run: pnpm --filter @talibon/web test
      - run: pnpm --filter @talibon/web build
      - run: pnpm --filter @talibon/web exec playwright install --with-deps chromium
      - run: pnpm --filter @talibon/web exec playwright test
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist
